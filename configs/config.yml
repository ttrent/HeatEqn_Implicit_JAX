grid:
  size: 100
  x0: 0.0
  xn: 10.0

time:
  start: 0.0
  end: 100.0
  step_size: 0.001
  save_rate:
    unit: steps
    value: 10

methods:
  integrator: implicit_midpoint
  solver: newton_method

solver:
  absolute_tolerance: 1.0e-8
  relative_tolerance: 1.0e-6
  max_iterations: 10
  linear_rtol_init: 1.0e-3
  linear_rtol_min: 1.0e-9
  linear_rtol_max: 1.0e-2
  linear_atol: 1.0e-12
  gmres_restart: 20
  gmres_maxiter: null

initial_state:
  offset: 0.0
  modes:
    - wavenumber: 1.0
      amplitude: 1.0
    - wavenumber: 3.0
      amplitude: 0.5

output:
  directory: output
  filename: heat_solution.h5
  buffer_rows: 100
