grid:
  size: 128
  x0: 0.0
  xn: 1.0

time:
  start: 0.0
  end: 1.0
  step_size: 0.001
  save_rate:
    unit: steps
    value: 10

methods:
  integrator: backward_euler
  solver: newton_method

initial_state:
  offset: 0.0
  modes:
    - wavenumber: 1.0
      amplitude: 1.0
    - wavenumber: 3.0
      amplitude: 0.5

output:
  directory: output
  filename: heat_solution.npz
